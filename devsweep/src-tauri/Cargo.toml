[package]
name = "devsweep"
version = "0.1.0"
description = "Cross-platform dev-dependency folder cleaner with a Tauri UI and CLI"
authors = ["DevSweep contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "devsweep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "devsweep"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
anyhow = "1"
thiserror = "1"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
once_cell = "1"
humansize = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
